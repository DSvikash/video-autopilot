[project]
name = "video-autopilot"
version = "0.1.0"
description = "Autonomous end-to-end AI video production and YouTube publishing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "click>=8.1.7",
    "moviepy>=2.0.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "edge-tts>=6.1.12",
    "google-api-python-client>=2.130.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
